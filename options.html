<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Adjusted Time Options</title>
  <style>
    :root {
      --bg-color: #181818;
      --text-color: #fff;
      --link-color: #4ea1ff;
      --font-family: sans-serif;
    }
    body {
      font-family: var(--font-family);
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2em;
    }
    h1, h2 {
      margin-top: 0;
    }
    .section {
      margin-bottom: 2em;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1em;
    }
    .preview-box {
      display: inline-flex;
      align-items: center;
      padding: 0 4px;
      border-radius: 2px;
      color: #fff;
      font-size: 13px;
      font-weight: 400;
      font-family: 'YouTube Sans', 'Roboto', 'Arial', 'sans-serif';
      border: 1px solid rgba(0,0,0,0.15);
      background: #ffa500;
      margin-left: 10px;
    }
    label {
      margin-right: 1em;
    }
    label.checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-right: 1em;
    }
    .btn {
      padding: 6px 12px;
      cursor: pointer;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
    }
    .btn:hover {
      background: #444;
    }
    .btn.ml-1 {
      margin-left: 1em;
    }
    .btn.mt-1 {
      margin-top: 1em;
    }
    .msg {
      margin-left: 1em;
      color: var(--link-color);
      display: none;
    }
    .link {
      color: var(--link-color);
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
    }
    select, input[type="color"], input[type="range"] {
      margin-left: 0.5em;
    }
    .v-middle {
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>YouTube Adjusted Time – Options</h1>
  <div class="section">
    <div class="input-group">
      <label for="theme">Theme:</label>
      <select id="theme"></select>
    </div>
    <div class="input-group">
      <label for="color">Box Color:</label>
      <input type="color" id="color" name="color">

      <label for="color-enabled" class="checkbox-label">
        <input type="checkbox" id="color-enabled" name="color-enabled" checked>
        Colored background
      </label>

      <label for="text-color">Text Color:</label>
      <input type="color" id="text-color" name="text-color">
    </div>
    <div class="input-group">
      <label for="box-opacity">Box Opacity:</label>
      <input type="range" id="box-opacity" name="box-opacity" min="0" max="100" value="100" class="v-middle">
      <span id="box-opacity-value">100%</span>
    </div>
    <div class="input-group">
      <label for="display-position">Position:</label>
      <select id="display-position">
        <option value="video-bar-integrated">Video Bar Integrated</option>
        <option value="top-right">Top Right</option>
        <option value="bottom-right">Bottom Right</option>
      </select>
    </div>
    <div class="input-group">
      <label for="show-endtime" class="checkbox-label">
        <input type="checkbox" id="show-endtime" checked>
        Show End Time
      </label>

      <label for="24hour" class="checkbox-label">
        <input type="checkbox" id="24hour">
        24-hour time
      </label>
    </div>

    <div class="mock-player" style="position: relative; width: 400px; height: 225px; background: #000; margin-top: 1em; border: 1px solid #333; overflow: hidden;">
      <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 30px; background: rgba(0,0,0,0.7); display: flex; align-items: center; padding: 0 10px; box-sizing: border-box;">
        <span style="color: #ccc; font-size: 12px; font-family: 'YouTube Sans', 'Roboto', sans-serif;">0:00 / 14:04</span>
        <span id="preview-integrated-container" style="display: inline-flex; align-items: center; margin-left: 8px;">
          <span id="preview" class="preview-box">9:02 | 5:10 PM</span>
        </span>
      </div>
    </div>
    <div class="input-group">
      <label for="cycle-shortcut">Cycle Format Shortcut:</label>
      <input type="text" id="cycle-shortcut" name="cycle-shortcut" value="Shift+T" style="width: 80px;">
    </div>
    <div class="input-group">
      <button id="apply-btn" class="btn">Apply</button>
      <span id="applied-msg" class="msg">Applied!</span>
    </div>
  </div>
  <div class="section" id="stats-section">
    <h2>YouTube Watch Statistics</h2>
    <div id="yt-stats-container">
      <em>Loading statistics...</em>
    </div>
    <button id="reset-stats-btn" class="btn mt-1">Reset Stats</button>
  </div>
  <div class="section">
    <button id="back-to-youtube" class="link">Back to YouTube</button>
  </div>
  <script src="options.js"></script>
</body>
</html>
