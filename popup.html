<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YT Time Settings</title>
  <style>
    body {
      font-family: sans-serif;
      background: #181818;
      color: #fff;
      margin: 0;
      padding: 16px;
      width: 250px;
    }
    .setting {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }
    label {
      margin-bottom: 4px;
      font-size: 13px;
    }
    select {
      padding: 4px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      text-align: center;
    }
    .options-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #4ea1ff;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
      background: none;
      border: none;
      padding: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <h2>YT Time Settings</h2>

  <div class="setting">
    <label for="time-format">Time Format:</label>
    <select id="time-format">
      <option value="hms">Hours:Mins:Secs</option>
      <option value="decimal">Decimal Hours</option>
    </select>
  </div>

  <div class="setting">
    <label for="display-position">Display Position:</label>
    <select id="display-position">
      <option value="default">Default</option>
      <option value="top-left">Top Left</option>
      <option value="top-right">Top Right</option>
    </select>
  </div>

  <button class="options-link" id="open-options">Advanced Options</button>

  <script src="popup.js"></script>
</body>
</html>
